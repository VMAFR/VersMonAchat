<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>VMA | VersMonAchat</title>

  <!-- Configuration PWA & Icône sur téléphone -->
  <meta name="theme-color" content="#182a46">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="VersMonAchat">

  <!-- Favicon et Logo Icône (logo.png) -->
  <link rel="icon" type="image/png" href="logo.png">
  <link rel="apple-touch-icon" href="logo.png">

  <!-- Manifest Web App -->
  <link rel="manifest" href='data:application/manifest+json,{"name":"VersMonAchat","short_name":"VMA","start_url":".","display":"standalone","background_color":"#ffffff","theme_color":"#182a46","icons":[{"src":"logo.png","sizes":"512x512","type":"image/png"}]}'>

  <!-- Script pour les confettis, Chart.js & SDK Firebase -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

  <style>
    :root {
      --primary: #182a46;        /* Bleu Marine VMA */
      --primary-hover: #101c30;
      --accent: #489b74;         /* Vert Émeraude VMA */
      --accent-hover: #3a805f;
      --bg: #f4f6f8;
      --card: #ffffff;
      --text: #182a46;
      --text-muted: #64748b;
      --danger: #ef4444;
      --info: #2563eb;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
    
    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      background: var(--card);
      width: 100%;
      max-width: 460px;
      padding: 24px;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
      display: flex;
      flex-direction: column;
    }

    /* BRANDING VMA */
    .brand-header {
      text-align: center;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid #f1f5f9;
    }

    .brand-logo-svg { width: 85px; height: 65px; margin: 0 auto; display: block; }
    .brand-title { font-size: 1.5rem; font-weight: 800; color: var(--primary); }
    .brand-title span { color: var(--accent); }
    .brand-slogan { font-size: 0.8rem; color: var(--text-muted); margin-top: 2px; }

    /* BARRE UTILISATEUR CONNECTÉ */
    .user-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #f8fafc;
      padding: 8px 12px;
      border-radius: 10px;
      margin-bottom: 14px;
      font-size: 0.8rem;
      border: 1px solid #e2e8f0;
    }

    .btn-logout {
      background: none;
      border: none;
      color: var(--danger);
      font-weight: 700;
      cursor: pointer;
      width: auto;
      padding: 0;
    }

    /* BARRE D'ONGLETS */
    .tabs-container {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 10px;
      margin-bottom: 16px;
      border-bottom: 1px solid #e5e7eb;
    }

    .tab-btn {
      padding: 8px 14px;
      border-radius: 20px;
      border: 1px solid #d1d5db;
      background: #f8fafc;
      color: var(--text);
      font-size: 0.85rem;
      font-weight: 600;
      white-space: nowrap;
      cursor: pointer;
    }

    .tab-btn.active { background: var(--primary); color: white; border-color: var(--primary); }
    .tab-btn.budget-tab { background: #eff6ff; color: #2563eb; border-color: #bfdbfe; }
    .tab-btn.budget-tab.active { background: #2563eb; color: white; }
    .tab-btn.add-btn { background: #eaf5f0; color: var(--accent); border-color: #c4e5d5; }

    h1 { font-size: 1.25rem; text-align: center; margin-bottom: 14px; color: var(--primary); }
    .form-group { margin-bottom: 12px; }
    label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 4px; color: var(--text-muted); }
    
    input, select, textarea {
      width: 100%;
      padding: 11px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      font-size: 0.95rem;
      outline: none;
      background: #fff;
    }

    button {
      width: 100%;
      padding: 12px;
      background-color: var(--primary);
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-accent { background-color: var(--accent); }
    .btn-danger { background-color: var(--danger); margin-top: 16px; }

    /* CARTES DU BUDGET GLOBAL */
    .budget-summary-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 16px;
    }

    .budget-card {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 10px;
      text-align: center;
    }

    .budget-card-title { font-size: 0.7rem; font-weight: 600; color: var(--text-muted); text-transform: uppercase; }
    .budget-card-value { font-size: 1.05rem; font-weight: 800; }

    .chart-box { width: 100%; max-width: 200px; margin: 12px auto; }
    .history-list { margin-top: 10px; max-height: 120px; overflow-y: auto; list-style: none; }
    .history-item { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid #f1f5f9; font-size: 0.85rem; }

    .app-footer { margin-top: 20px; padding-top: 10px; border-top: 1px dashed #e2e8f0; text-align: center; }
    .contact-link { color: var(--text-muted); font-size: 0.8rem; text-decoration: none; font-weight: 500; cursor: pointer; }

    .hidden { display: none !important; }
    .auth-toggle { text-align: center; margin-top: 12px; font-size: 0.85rem; color: var(--accent); cursor: pointer; text-decoration: underline; }
  </style>
</head>
<body>

  <div class="container">
    
    <!-- BRANDING VMA -->
    <div class="brand-header">
      <svg class="brand-logo-svg" viewBox="0 0 200 150" fill="none">
        <circle cx="100" cy="70" r="55" fill="#EAEFEA" />
        <path d="M100 25 L145 95 L55 95 Z" fill="#182A46" />
        <path d="M100 25 L145 95 L100 95 Z" fill="#101C30" />
        <path d="M100 90 Q92 75 100 60 Q108 45 100 25" stroke="#489B74" stroke-width="5" fill="none" />
        <line x1="100" y1="25" x2="100" y2="10" stroke="#182A46" stroke-width="3" />
        <path d="M100 10 L118 16 L100 22 Z" fill="#489B74" />
      </svg>
      <div class="brand-title">Vers<span>Mon</span>Achat</div>
      <div class="brand-slogan">Chaque euro t'emmène <span>plus près.</span></div>
    </div>

    <!-- ÉCRAN DE CONNEXION / INSCRIPTION -->
    <div id="auth-view">
      <h1 id="auth-title">Connexion à votre compte</h1>
      <form id="auth-form">
        <div class="form-group">
          <label for="auth-email">Adresse E-mail</label>
          <input type="email" id="auth-email" placeholder="votre@email.com" required>
        </div>
        <div class="form-group">
          <label for="auth-password">Mot de passe</label>
          <input type="password" id="auth-password" placeholder="••••••••" required>
        </div>
        <button type="submit" id="auth-submit-btn" class="btn-accent">Se connecter</button>
      </form>
      <div id="auth-toggle-btn" class="auth-toggle">Pas encore de compte ? S'inscrire</div>
    </div>

    <!-- APPLICATION PRINCIPALE (AFFICHER UNE FOIS CONNECTÉ) -->
    <div id="app-content" class="hidden">
      
      <!-- BARRE UTILISATEUR CONNECTÉ -->
      <div class="user-bar">
        <span id="user-email-display">---</span>
        <button id="logout-btn" class="btn-logout">Déconnexion</button>
      </div>

      <!-- ONGLETS -->
      <div id="tabs-container" class="tabs-container"></div>

      <!-- ÉCRAN BUDGET GLOBAL -->
      <div id="budget-view">
        <h1>📊 Mon Budget Global</h1>
        <div class="budget-summary-grid">
          <div class="budget-card"><div class="budget-card-title">Épargne</div><div id="b-total-savings" class="budget-card-value" style="color:#2563eb;">0 €</div></div>
          <div class="budget-card"><div class="budget-card-title">Rentrées</div><div id="b-total-income" class="budget-card-value" style="color:var(--accent);">+0 €</div></div>
          <div class="budget-card"><div class="budget-card-title">Dépenses</div><div id="b-total-expenses" class="budget-card-value" style="color:var(--danger);">-0 €</div></div>
          <div class="budget-card"><div class="budget-card-title">Reste</div><div id="b-net-monthly" class="budget-card-value">0 €</div></div>
        </div>
        
        <div class="chart-box"><canvas id="budgetPieChart"></canvas></div>
        
        <form id="budget-item-form" style="background:#f8fafc; padding:12px; border-radius:12px; margin-bottom:12px; border:1px solid #e2e8f0;">
          <div class="form-group">
            <select id="b-item-type">
              <option value="savings">🏦 Épargne (Livret A, LDD...)</option>
              <option value="income">📈 Rentrée (Salaire, Aides...)</option>
              <option value="expense">📉 Dépense (Loyer, Abonnements...)</option>
            </select>
          </div>
          <div style="display:flex; gap:8px;">
            <input type="text" id="b-item-name" placeholder="Nom (ex: Livret A)" required style="flex:2;">
            <input type="number" id="b-item-amount" placeholder="€" required style="flex:1;">
          </div>
          <button type="submit" class="btn-accent" style="margin-top:8px;">Ajouter à mon budget</button>
        </form>
        <ul id="budget-items-list" class="history-list"></ul>
      </div>

      <!-- ÉCRAN NOUVEL OBJECTIF -->
      <div id="setup-view" class="hidden">
        <h1>🎯 Nouvel Objectif</h1>
        <form id="goal-form">
          <div class="form-group">
            <label>Nom de l'objectif</label>
            <input type="text" id="goal-name" placeholder="Ex: PS5, Voyage..." required>
          </div>
          <div class="form-group">
            <label>Montant cible (€)</label>
            <input type="number" id="goal-target" min="1" step="any" placeholder="Ex: 500" required>
          </div>
          <div class="form-group">
            <label>Émoji</label>
            <input type="text" id="goal-emoji" value="🎯" maxlength="4">
          </div>
          <button type="submit" class="btn-accent">Créer ma tirelire</button>
        </form>
      </div>

      <!-- ÉCRAN DASHBOARD OBJECTIF -->
      <div id="dashboard-view" class="hidden">
        <div style="text-align:center; margin-bottom:12px;">
          <span id="display-emoji" style="font-size:3rem;">🎯</span>
          <h2 id="display-title">---</h2>
        </div>
        <div style="text-align:center;">
          <div style="font-size:1.8rem; font-weight:800; color:var(--primary);"><span id="display-current">0</span> € / <span id="display-target">0 €</span></div>
          <div class="chart-box"><canvas id="goalPieChart"></canvas></div>
        </div>
        <form id="deposit-form">
          <div style="display:flex; gap:8px;">
            <input type="number" id="deposit-amount" min="0.01" step="any" placeholder="Ajouter €" required>
            <button type="submit" class="btn-accent" style="width:auto; padding:0 16px;">+ Ajouter</button>
          </div>
        </form>
        <ul id="history-list" class="history-list"></ul>
        <button id="reset-btn" class="btn-danger">Supprimer cet objectif</button>
      </div>

    </div>

    <!-- FOOTER AVEC LIEN DE CONTACT -->
    <div class="app-footer">
      <a href="mailto:fabiodesign63000@gmail.com" class="contact-link">💬 Un problème ? Contactez-nous</a>
    </div>

  </div>

  <script>
    // TES CLÉS FIREBASE OFFICIELLES
    const firebaseConfig = {
      apiKey: "AIzaSyAIKTKl5kjV-7sVZG5PitA3OpLcYgO3lAE",
      authDomain: "versmonachat.firebaseapp.com",
      projectId: "versmonachat",
      storageBucket: "versmonachat.firebasestorage.app",
      messagingSenderId: "789306526811",
      appId: "1:789306526811:web:7518eac8cbd4c0b9b3437e",
      measurementId: "G-1EFSW03NSK"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    let currentUser = null;
    let isSignUpMode = false;
    let state = { goals: [], activeGoalId: 'BUDGET', budget: { items: [] } };
    let goalChart = null, budgetChart = null;

    // ÉLÉMENTS DOM
    const authView = document.getElementById('auth-view');
    const appContent = document.getElementById('app-content');
    const authForm = document.getElementById('auth-form');
    const authToggleBtn = document.getElementById('auth-toggle-btn');
    const authTitle = document.getElementById('auth-title');
    const authSubmitBtn = document.getElementById('auth-submit-btn');
    const logoutBtn = document.getElementById('logout-btn');
    const userEmailDisplay = document.getElementById('user-email-display');

    // BASCULER CONNEXION / INSCRIPTION
    authToggleBtn.addEventListener('click', () => {
      isSignUpMode = !isSignUpMode;
      authTitle.textContent = isSignUpMode ? "Créer un compte" : "Connexion à votre compte";
      authSubmitBtn.textContent = isSignUpMode ? "S'inscrire" : "Se connecter";
      authToggleBtn.textContent = isSignUpMode ? "Déjà un compte ? Se connecter" : "Pas encore de compte ? S'inscrire";
    });

    // SOUMISSION AUTHENTIFICATION
    authForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const email = document.getElementById('auth-email').value;
      const pass = document.getElementById('auth-password').value;

      if (isSignUpMode) {
        auth.createUserWithEmailAndPassword(email, pass)
          .catch(err => alert("Erreur lors de l'inscription : " + err.message));
      } else {
        auth.signInWithEmailAndPassword(email, pass)
          .catch(err => alert("Erreur de connexion : " + err.message));
      }
    });

    logoutBtn.addEventListener('click', () => auth.signOut());

    // ÉCOUTEUR D'ÉTAT DE CONNEXION
    auth.onAuthStateChanged(user => {
      currentUser = user;
      if (user) {
        authView.classList.add('hidden');
        appContent.classList.remove('hidden');
        userEmailDisplay.textContent = user.email;
        loadUserData();
      } else {
        authView.classList.remove('hidden');
        appContent.classList.add('hidden');
      }
    });

    // CHARGEMENT & SAUVEGARDE EN LIGNE (FIRESTORE)
    function loadUserData() {
      if (!currentUser) return;
      db.collection('users').doc(currentUser.uid).onSnapshot(doc => {
        if (doc.exists) {
          state = doc.data();
          if (!state.budget) state.budget = { items: [] };
          render();
        } else {
          saveState();
        }
      });
    }

    function saveState() {
      if (!currentUser) return;
      db.collection('users').doc(currentUser.uid).set(state);
    }

    // GRAPHIQUE BUDGET
    function updateBudgetChart(savings, income, expenses) {
      const ctx = document.getElementById('budgetPieChart').getContext('2d');
      if (budgetChart) budgetChart.destroy();
      budgetChart = new Chart(ctx, {
        type: 'pie',
        data: {
          labels: ['Épargne', 'Revenus', 'Dépenses'],
          datasets: [{ data: [savings, income, expenses], backgroundColor: ['#2563eb', '#489b74', '#ef4444'] }]
        },
        options: { responsive: true, plugins: { legend: { position: 'bottom' } } }
      });
    }

    // GRAPHIQUE OBJECTIF
    function updateGoalChart(currentAmount, targetAmount) {
      const ctx = document.getElementById('goalPieChart').getContext('2d');
      const remainingAmount = Math.max(0, targetAmount - currentAmount);

      if (goalChart) goalChart.destroy();
      goalChart = new Chart(ctx, {
        type: 'doughnut',
        data: {
          labels: ['Économisé', 'Reste'],
          datasets: [{ data: [currentAmount, remainingAmount], backgroundColor: ['#489b74', '#182a46'] }]
        },
        options: { responsive: true, plugins: { legend: { position: 'bottom' } } }
      });
    }

    function renderBudget() {
      const items = state.budget.items || [];
      let savings = 0, income = 0, expenses = 0;
      items.forEach(i => {
        if (i.type === 'savings') savings += i.amount;
        if (i.type === 'income') income += i.amount;
        if (i.type === 'expense') expenses += i.amount;
      });

      document.getElementById('b-total-savings').textContent = savings.toLocaleString('fr-FR') + ' €';
      document.getElementById('b-total-income').textContent = '+' + income.toLocaleString('fr-FR') + ' €';
      document.getElementById('b-total-expenses').textContent = '-' + expenses.toLocaleString('fr-FR') + ' €';
      document.getElementById('b-net-monthly').textContent = (income - expenses).toLocaleString('fr-FR') + ' €';

      updateBudgetChart(savings, income, expenses);

      const list = document.getElementById('budget-items-list');
      list.innerHTML = '';
      items.forEach((item, index) => {
        const li = document.createElement('li');
        li.className = 'history-item';
        li.innerHTML = `<span><strong>${item.name}</strong></span> <span>${item.amount.toLocaleString('fr-FR')} € <button onclick="deleteBudgetItem(${index})" style="width:auto; background:none; color:red; border:none; cursor:pointer;">&times;</button></span>`;
        list.appendChild(li);
      });
    }

    window.deleteBudgetItem = function(index) {
      state.budget.items.splice(index, 1);
      saveState();
    };

    document.getElementById('budget-item-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const type = document.getElementById('b-item-type').value;
      const name = document.getElementById('b-item-name').value;
      const amount = parseFloat(document.getElementById('b-item-amount').value);
      state.budget.items.push({ type, name, amount });
      saveState();
      e.target.reset();
    });

    function renderTabs() {
      const tabsContainer = document.getElementById('tabs-container');
      tabsContainer.innerHTML = '';
      
      const bBtn = document.createElement('button');
      bBtn.className = `tab-btn budget-tab ${state.activeGoalId === 'BUDGET' ? 'active' : ''}`;
      bBtn.textContent = '📊 Budget Global';
      bBtn.onclick = () => { state.activeGoalId = 'BUDGET'; render(); };
      tabsContainer.appendChild(bBtn);

      state.goals.forEach(g => {
        const btn = document.createElement('button');
        btn.className = `tab-btn ${g.id === state.activeGoalId ? 'active' : ''}`;
        btn.textContent = `${g.emoji} ${g.title}`;
        btn.onclick = () => { state.activeGoalId = g.id; render(); };
        tabsContainer.appendChild(btn);
      });

      const addBtn = document.createElement('button');
      addBtn.className = `tab-btn add-btn ${state.activeGoalId === 'NEW' ? 'active' : ''}`;
      addBtn.textContent = '➕ Nouvel objectif';
      addBtn.onclick = () => { state.activeGoalId = 'NEW'; render(); };
      tabsContainer.appendChild(addBtn);
    }

    function render() {
      renderTabs();
      const bView = document.getElementById('budget-view');
      const sView = document.getElementById('setup-view');
      const dView = document.getElementById('dashboard-view');

      bView.classList.add('hidden');
      sView.classList.add('hidden');
      dView.classList.add('hidden');

      if (state.activeGoalId === 'BUDGET') {
        bView.classList.remove('hidden');
        renderBudget();
      } else if (state.activeGoalId === 'NEW') {
        sView.classList.remove('hidden');
      } else {
        const goal = state.goals.find(g => g.id === state.activeGoalId);
        if (goal) {
          dView.classList.remove('hidden');
          document.getElementById('display-title').textContent = goal.title;
          document.getElementById('display-emoji').textContent = goal.emoji;
          document.getElementById('display-current').textContent = goal.current.toFixed(2);
          document.getElementById('display-target').textContent = goal.target.toFixed(2) + ' €';
          updateGoalChart(goal.current, goal.target);
        }
      }
    }

    document.getElementById('goal-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const title = document.getElementById('goal-name').value;
      const target = parseFloat(document.getElementById('goal-target').value);
      const emoji = document.getElementById('goal-emoji').value || '🎯';
      const newGoal = { id: Date.now().toString(), title, target, current: 0, emoji, history: [] };
      state.goals.push(newGoal);
      state.activeGoalId = newGoal.id;
      saveState();
      e.target.reset();
    });

    document.getElementById('deposit-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const amount = parseFloat(document.getElementById('deposit-amount').value);
      const goal = state.goals.find(g => g.id === state.activeGoalId);
      if (goal && amount > 0) {
        goal.current += amount;
        if (typeof confetti === 'function' && goal.current >= goal.target) {
          confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
        }
        saveState();
        document.getElementById('deposit-amount').value = '';
      }
    });

    document.getElementById('reset-btn').addEventListener('click', () => {
      if (confirm("Voulez-vous vraiment supprimer cet objectif ?")) {
        state.goals = state.goals.filter(g => g.id !== state.activeGoalId);
        state.activeGoalId = 'BUDGET';
        saveState();
      }
    });
  </script>
</body>
</html>
